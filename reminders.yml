name: Match reminders (email)

on:
  schedule:
    - cron: '0 4 * * *'     # 07:00 שעון ישראל בקיץ (06:00 בחורף)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-cloud-firestore
      - run: echo '${{ secrets.FIREBASE_SA }}' > /tmp/sa.json
      - name: Send reminders
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: python reminders/send_reminders.py
