name: Sync attendance -> portal

on:
  schedule:
    - cron: '*/15 * * * *'  # כל רבע שעה — מספר שמוזן בנוכחות מגיע לפורטל כמעט מיד
    - cron: '30 20 * * *'   # 23:30 שעון ישראל, אחרי כל האימונים (סנכרון מלא יומי)
  workflow_dispatch:
    inputs:
      auto_add_phones:
        description: 'לייבא גם את מספרי הטלפון ולפתוח משתמשים בפורטל'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-cloud-firestore
      - run: |
          echo '${{ secrets.FIREBASE_SA }}' > /tmp/portal-sa.json
          echo '${{ secrets.ATTENDANCE_SA }}' > /tmp/attendance-sa.json
      - name: Sync
        env:
          PORTAL_SA: /tmp/portal-sa.json
          ATTENDANCE_SA: /tmp/attendance-sa.json
          # בהרצה ידנית לפי הבחירה; בהרצה המתוזמנת תמיד מייבא טלפונים חדשים
          AUTO_ADD_PHONES: ${{ (github.event_name == 'schedule' || inputs.auto_add_phones) && '1' || '0' }}
        run: python sync/sync_attendance.py
