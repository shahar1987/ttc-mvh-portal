name: Sync attendance -> portal

on:
  schedule:
    - cron: '30 20 * * *'   # 23:30 שעון ישראל, אחרי כל האימונים
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-cloud-firestore
      - run: |
          echo '${{ secrets.FIREBASE_SA }}' > /tmp/portal-sa.json
          echo '${{ secrets.ATTENDANCE_SA }}' > /tmp/attendance-sa.json
      - name: Sync
        env:
          PORTAL_SA: /tmp/portal-sa.json
          ATTENDANCE_SA: /tmp/attendance-sa.json
        run: python sync/sync_attendance.py
