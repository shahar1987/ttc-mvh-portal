name: Match reminders (email)

on:
  schedule:
    - cron: '0 4 * * *'     # 07:00 שעון ישראל בקיץ (06:00 בחורף)
  workflow_dispatch:
    inputs:
      mode:
        description: 'מצב הרצה'
        type: choice
        default: dry-run
        options: [dry-run, send, test]
      test_email:
        description: 'למצב test בלבד — לאן לשלוח מייל בדיקה'
        default: ''

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-cloud-firestore
      - name: Write service account
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SA_JSON" > /tmp/sa.json
      - name: Send reminders
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          # קלט מהמשתמש עובר דרך משתני סביבה ולא מוזרק לתוך הסקריפט (מונע הזרקת פקודות)
          MODE: ${{ inputs.mode }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          if [ -z "$MODE" ]; then MODE="send"; fi          # הרצה מתוזמנת = שליחה אמיתית
          case "$MODE" in
            dry-run) python reminders/send_reminders.py --dry-run ;;
            test)    python reminders/send_reminders.py --test "$TEST_EMAIL" ;;
            *)       python reminders/send_reminders.py ;;
          esac
